codecov:
  require_ci_to_pass: yes
  bot: "qmrlab-coverage"
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "40...100"
  status:
    patch: off
    project:
      # One status, over the `matlab` flag, which now carries BOTH the
      # model-fitting suites and the GUI suite.
      #
      # There was an Octave status here targeting a flag named `octave`. Nothing
      # has produced that flag: .github/workflows/ contains one workflow and it
      # uploads `matlab` twice and (previously) `gui`. So the status was gating on
      # a flag with no producer.
      Matlab:
        target: 40%
        flags:
          - matlab

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no

ignore:
  - "src/Common/tools/FileBrowser"
  - "src/Common/tools/FileBrowser/dicomLoadAllSeries.m"
  - "src/Common/ParFitData.m"
